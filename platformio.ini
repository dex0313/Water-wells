; PlatformIO Project Configuration File
;
; P1-8: shared options live in [env]; one environment per role
; (base / node / repeater) plus the host test environment (native).
; P1-9: platform and library versions are pinned to what the
; project was actually built and verified with.
;
; https://docs.platformio.org/page/projectconf.html

[env]
; P1-9: pinned platform (Arduino core 2.x line).
; TODO(owner): verify with `pio pkg list` after the first build on
; your machine; see the revision report for the checked versions.
platform = espressif32@6.10.0
monitor_speed = 115200

; P1-8: warnings on; the build must stay clean.
build_flags =
  -Wall
  -Wextra

[env:base]
board = esp32dev
framework = arduino
build_flags =
  ${env.build_flags}
  -D ROLE_BASE
lib_deps =
  knolleary/PubSubClient@2.8
  adafruit/Adafruit BME280 Library@2.2.4
  adafruit/Adafruit Unified Sensor@1.1.15

[env:node]
board = esp32dev
framework = arduino
build_flags =
  ${env.build_flags}
  -D ROLE_NODE
lib_deps =
  adafruit/Adafruit BME280 Library@2.2.4
  adafruit/Adafruit Unified Sensor@1.1.15

; ------------------------------------------------------------
; FR-1 / FR-2: optional build variants.
; Any environment can also switch the radio module or drop the
; sensor code by extending build_flags:
;   -D LORA_MODULE_E220      E220-400T22D instead of E22-400T33D
;   -D FEATURE_SENSORS=0     relay-only well, no BME280/ZMPT101B
; Example (future wells behind a repeater, relay-only E220):
;   -D ROLE_NODE -D LORA_MODULE_E220 -D FEATURE_SENSORS=0
; ------------------------------------------------------------

[env:node_e220]
; FR-1: a well linked through a repeater will use E220-400T22D.
; Identical to [env:node] except the module selection; the runtime
; PHY is shared, only the register map / RF-profile encoding differ
; (see include/lora_module.h).
board = esp32dev
framework = arduino
build_flags =
  ${env.build_flags}
  -D ROLE_NODE
  -D LORA_MODULE_E220
lib_deps =
  adafruit/Adafruit BME280 Library@2.2.4
  adafruit/Adafruit Unified Sensor@1.1.15

[env:node_relay_only]
; FR-2: relay-only well — BME280/ZMPT101B code is compiled out
; (FEATURE_SENSORS=0), the node profile becomes relays-only
; (num_sensors = 0, telemetry = NaN). Radio: E22 (default);
; add -D LORA_MODULE_E220 for the future E220 wells.
board = esp32dev
framework = arduino
build_flags =
  ${env.build_flags}
  -D ROLE_NODE
  -D FEATURE_SENSORS=0

[env:repeater]
; R5: repeater profile — no relays/ZMPT, BME280 optional,
; no MQTT/WiFi stack. Repeater addresses use the 200..250 range.
board = esp32dev
framework = arduino
build_flags =
  ${env.build_flags}
  -D ROLE_REPEATER
  -D NODE_ID=200
lib_deps =
  adafruit/Adafruit BME280 Library@2.2.4
  adafruit/Adafruit Unified Sensor@1.1.15

[env:native]
; T-1..T-6: host unit tests for the pure logic modules
; (protocol, frame_parser, dedup, cmd_parse, ack_match, rms).
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -D UNIT_TEST
; compile the pure-logic src modules into the test binaries
test_build_src = true
build_src_filter =
  -<*>
  +<protocol.cpp>
  +<frame_parser.cpp>
  +<dedup.cpp>
  +<cmd_parse.cpp>
  +<ack_match.cpp>
  +<rms.cpp>

; ------------------------------------------------------------
; P1-9: the firmware is also verified to build on the Arduino core
; 3.x line (pioarduino fork). To build against core 3.2.0, replace
; the [env] platform line with:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
; (base / node / repeater all compile with -Wall -Wextra clean;
;  the WDT init in persistence.cpp picks the right API automatically)
; ------------------------------------------------------------
